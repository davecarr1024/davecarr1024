collection:
  name: "Viollet-le-Duc fortification books"
  question: >-
    Given ground, an objective, resources, contemporary means, and an
    adversary model, can an engineer produce and explain a defensible plan?
  primary_project: "Barbacane"

sources:
  annals:
    author: "Eugène-Emmanuel Viollet-le-Duc"
    original_title: "Histoire d'une forteresse"
    original_year: 1874
    english_title: "Annals of a Fortress"
    translator: "Benjamin Bucknall"
    english_edition_year: 1876
    form: "Illustrated fictional chronicle and engineering argument"
    canonical_world: "Val d'Ohet"
    gutenberg_ebook: 41426
    source_url: "https://www.gutenberg.org/ebooks/41426"
    french_source_url: "https://gallica.bnf.fr/ark:/12148/bpt6k36156x"

  castles_and_warfare:
    author: "Eugène-Emmanuel Viollet-le-Duc"
    original_title: "Essai sur l'architecture militaire au Moyen Âge"
    original_year: 1854
    first_english_title: "An Essay on the Military Architecture of the Middle Ages"
    translator: "M. Macdermott"
    english_edition_year: 1860
    modern_title: "Castles and Warfare in the Middle Ages"
    dover_edition_year: 2005
    paperback_isbn: "978-0-486-44020-0"
    form: "Comparative illustrated architectural and military essay"
    source_url: "https://books.google.com/books?id=jmeTa9bJclwC"
    publisher_url: "https://store.doverpublications.com/products/9780486440200"

evidence_labels:
  source_fact:
    definition: "Directly stated or depicted in an identified edition."
  interpretation:
    definition: "A reasoned reading of the source's purpose or meaning."
  model_assumption:
    definition: "A simplification introduced to make a scenario executable."
  generated_finding:
    definition: "A result computed from encoded scenario inputs."

shared_topics:
  terrain_and_site:
    summary: "Ground constrains approach, construction, observation, and defense."
    terms:
      - "valley"
      - "promontory"
      - "plateau"
      - "slope"
      - "escarpment"
      - "river"
      - "marsh"
      - "road"
      - "bridge"
      - "commanding ground"
      - "masked ground"
    model_hooks:
      - "terrain regions"
      - "movement suitability"
      - "construction suitability"
      - "battery suitability"
      - "approach derivation"

  approach_and_access:
    summary: "An approach is the evolving ability to bring an action to a target."
    terms:
      - "approach"
      - "passage"
      - "gate"
      - "postern"
      - "drawbridge"
      - "ditch crossing"
      - "breach"
      - "sap"
      - "mine"
    effect_vocabulary:
      - "blocks"
      - "redirects"
      - "lengthens"
      - "narrows"
      - "delays"
      - "exposes"
      - "protects"
      - "enables next action"
    model_hooks:
      - "approach corridor"
      - "access-state graph"
      - "required action"
      - "movement and equipment class"

  mutual_support:
    summary: "A work should act for its neighbors and receive support in return."
    terms:
      - "flanking"
      - "enfilade"
      - "overlapping fire"
      - "command"
      - "masking"
      - "dead ground"
      - "support"
    model_hooks:
      - "support graph"
      - "conditional line of action"
      - "capability-specific coverage"
      - "feature-removal counterfactual"

  defense_in_depth:
    summary: "A useful plan preserves defensible states after individual works fail."
    terms:
      - "outwork"
      - "barbican"
      - "bailey"
      - "keep"
      - "retrenched position"
      - "fallback"
      - "sortie"
      - "retreat"
    model_hooks:
      - "defensible-state graph"
      - "capture transition"
      - "protected friendly movement"
      - "inner action on captured outer area"

  construction_and_resources:
    summary: "Plans allocate labor, time, material, troops, and weapons."
    terms:
      - "earth"
      - "timber"
      - "masonry"
      - "revetment"
      - "gabion"
      - "labor"
      - "garrison"
      - "repair"
      - "ammunition"
    model_hooks:
      - "resource bundle"
      - "construction prerequisite"
      - "construction duration"
      - "maintenance and repair"

  observation_and_belief:
    summary: "Plans and counterplans are made from incomplete observations."
    terms:
      - "reconnaissance"
      - "watch"
      - "concealment"
      - "mine detection"
      - "doctrine"
      - "assumption"
      - "surprise"
    model_hooks:
      - "world truth"
      - "actor observation"
      - "actor belief"
      - "decision rationale"
      - "uncertainty"

  period_change:
    summary: "Persistent principles have different spatial applications as means change."
    terms:
      - "weapon range"
      - "destructive effect"
      - "protected approach"
      - "artillery platform"
      - "earth backing"
      - "detached fort"
      - "retrofit"
      - "obsolescence"
    model_hooks:
      - "capability-bearing era profile"
      - "inherited-work constraint"
      - "period-valid action palette"
      - "cross-era plan comparison"

  explanation_and_report:
    summary: "Prose and diagrams should expose the same structured evidence."
    terms:
      - "plan"
      - "section"
      - "elevation"
      - "chronicle"
      - "claim"
      - "evidence"
      - "limitation"
      - "counterfactual"
    model_hooks:
      - "stable claim identifier"
      - "geometric witness"
      - "diagram layer"
      - "deterministic prose"
      - "source-to-result provenance"

